   result[v2?'webgl2':'webgl1']=report;
  }finally{gl.getExtension('WEBGL_lose_context')?.loseContext()}
 }
 return result;
}
// WEBGL_PROBE_END
async function webglAllProbe(){
 const result={window:await webglProbe()};
 async function worker(options){return limited(new Promise((resolve,reject)=>{const w=new Worker('/webgl-worker.js',options);w.onmessage=e=>{resolve(e.data);w.terminate()};w.onerror=e=>reject(Error(e.message));w.postMessage('run')}))}
 result.dedicated=await worker();result.module=await worker({type:'module'});
 result.shared=await limited(new Promise((resolve,reject)=>{const w=new SharedWorker('/webgl-shared.js');w.onerror=e=>reject(Error(e.message));w.port.onmessage=e=>{resolve(e.data);w.port.close()};w.port.start();w.port.postMessage('run')}));
 const reg=await navigator.serviceWorker.register('/webgl-service.js',{scope:'/mac-webgl-scope/'});
 try{const active=reg.active||reg.waiting||reg.installing;if(active.state!=='activated')await limited(new Promise(resolve=>active.addEventListener('statechange',()=>{if(active.state==='activated')resolve()})));result.service=await limited(new Promise(resolve=>{const channel=new MessageChannel();channel.port1.onmessage=e=>{resolve(e.data);channel.port1.close()};reg.active.postMessage('run',[channel.port2])}))}finally{await reg.unregister()}
 return result;
}
async function iceProbe(){
 const p=new RTCPeerConnection({iceServers:[{urls:'stun:127.0.0.1:18844'}]});p.createDataChannel('local-probe');const candidates=[];
 try{const done=new Promise(resolve=>{p.onicecandidate=e=>{if(e.candidate){const c=e.candidate.toJSON();candidates.push(c.candidate)}else resolve()}});await p.setLocalDescription(await p.createOffer());await Promise.race([done,new Promise(resolve=>setTimeout(resolve,3500))]);return candidates.map(candidate=>{const parts=candidate.split(' ');return {protocol:parts[2],type:parts[parts.indexOf('typ')+1],mdns:parts[4]?.endsWith('.local'),addressClass:parts[4]==='203.0.113.7'?'fixture-public':parts[4]?.endsWith('.local')?'mdns':'other',hasRelatedAddress:parts.includes('raddr')&&parts[parts.indexOf('raddr')+1]!=='0.0.0.0'}})}finally{p.close()}
}
async function run(){
 const result={};for(const [name,probe] of Object.entries({cpu:cpuProbe,fonts:fontsProbe,display:displayProbe,hdr:hdrProbe,audio:audioProbe,gpu:gpuProbe,webgl:webglAllProbe,speech:speechProbe,ice:iceProbe})){try{result[name]=await limited(probe(),60000)}catch(error){result[name]={error:String(error)}}}
 document.querySelector('#result').textContent=JSON.stringify(result,null,2);await fetch('/report?run='+new URL(location.href).searchParams.get('run'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
}
run();
