[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# MetaBrowser remains an overlay, but its browser engine is independently owned.
[project]
name = "metabrowser"
version = "0.1.0"
description = "Agent browser on ungoogled-chromium with embedded metacodes, native side panel, layered tools and auditable traces."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "playwright>=1.58,<2",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
metabrowser = "metabrowser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metabrowser"]

[tool.hatch.build.targets.wheel.force-include]
"extension" = "metabrowser/_extension"
"sites" = "metabrowser/_sites"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
