<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>MetaBrowser Agent</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <nav id="sessions" role="tablist" aria-label="Agent sessions"></nav>
    <button id="new-session" title="New session" aria-label="New session">＋</button>
    <button id="record" title="录制我的操作，生成 skill" aria-label="录制">● 录制</button>
    <span id="status" class="status">connecting…</span>
  </header>
  <div id="banner" hidden></div>
  <section id="record-card" hidden>
    <div class="risk">录制完成 · <span id="rec-steps"></span></div>
    <label>这段操作是在做什么？<textarea id="rec-intent" rows="2" placeholder="例如：导出昨天按计划维度的消耗报表"></textarea></label>
    <div class="row-inline"><label>站点 <input id="rec-site"></label><label>skill 名称 <input id="rec-name" placeholder="snake_case"></label></div>
    <div class="row"><button id="rec-discard">丢弃</button><button id="rec-save">保存录制</button><button id="rec-forge">生成 skill</button></div>
  </section>
  <section id="approvals" aria-live="assertive"></section>
  <main id="log" aria-live="polite"></main>
  <details id="activity">
    <summary>Browser activity <span id="activity-count">0</span></summary>
    <ol id="activity-list"></ol>
  </details>
  <form id="composer">
    <textarea id="input" rows="3" placeholder="让 agent 在浏览器里做点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <div class="row">
      <button type="button" id="stop">Stop</button>
      <button type="submit" id="send">Send</button>
    </div>
  </form>
  <script src="sidepanel.js"></script>
</body>
</html>
